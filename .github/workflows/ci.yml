name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Lint, Type Check, SAST & Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e ".[dev]"

      - name: Code Formatting Check (Ruff)
        run: ruff format --check .

      - name: Linter Check (Ruff)
        run: ruff check .

      - name: Strict Static Type Check (Mypy)
        run: mypy --strict src tests

      - name: Security SAST Audit (Bandit)
        run: bandit -r src/

      - name: Test Suite & Coverage Verification (Pytest >= 90%)
        run: pytest
